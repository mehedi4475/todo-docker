name: Build and Push Docker Image

# কখন এই পাইপলাইন চলবে
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড runner মেশিনে নামিয়ে আনে
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. Docker Hub-এ লগইন করে (সিক্রেট ব্যবহার করে)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ৩. image বানিয়ে Docker Hub-এ push করে
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-docker:latest

      # ৪. VPS-এ SSH দিয়ে ঢুকে নতুন image বসানো
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/todo-app
            docker compose pull
            docker compose up -d
            docker image prune -f